<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icons render as small as 16px, so this uses the site's olive/ivory
       pair at full contrast and a plain serif: web fonts are not available to
       a favicon, and a script face would be unreadable at that size. -->
  <rect width="32" height="32" fill="#3D330E"/>
  <text x="16" y="21"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="9"
        font-weight="700"
        fill="#FFFFF0">M&amp;G</text>
</svg>
